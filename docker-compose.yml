services:
  postgres:
    image: postgres:15
    container_name: taskforge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: taskforge_storage
    restart: always
    command: server -s3
    ports:
      - "8333:8333"
      - "9333:9333"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
    volumes:
      - seaweedfs-data:/data

volumes:
  pgdata:
  seaweedfs-data:
